# Production Cloudflare Worker config (D15/D16 cutover, erp/PLAN.md). Deployed
# by .github/workflows/cloudflare-production.yml on every push to main.
#
# `npm run build` (React Router with the Cloudflare Vite plugin, vite.config.ts)
# emits a workerd ESM module at dist/server/index.js with a standard
# `fetch(request, env, ctx)` export (server.ts) and the static assets in
# dist/client. This file points the Worker at that build output.
#
# wrangler.toml (no suffix) is the isolated preview config: no custom-domain
# routes, no rate limit bindings, staging catalog.
name = "opendrone-web"
main = "dist/server/index.js"
compatibility_date = "2025-04-01"

# D16 cutover: the Worker serves opendrone.be and www.opendrone.be directly
# once the zone's nameservers point at Cloudflare (erp/PLAN.md D15/D16).
# server.ts 301s www to the apex to match Shopify's current behaviour.
routes = [
  { pattern = "opendrone.be", custom_domain = true },
  { pattern = "www.opendrone.be", custom_domain = true },
]

[assets]
directory = "dist/client"

# Public, non-secret defaults (see .env.example). SESSION_SECRET is a
# per-environment secret set with `wrangler secret put SESSION_SECRET` and is
# never written here.
[vars]
CATALOG_URL = "https://erp.incutec.com/incutec/catalog.json"
PUBLIC_SHOP_URL = "https://shop.incutec.com"

# Workers Rate Limiting bindings for /api/support/lookup (founder decision,
# 2026-09-15: replaced Upstash-backed global rate limiting). Each binding is
# a fixed limit/period pair — Cloudflare only supports a 10s or 60s window —
# configured here, not passed at call time; see env.d.ts and
# app/routes/api.support.lookup.tsx. namespace_id only needs to be a unique
# positive integer within this account; no external provisioning needed.
[[ratelimits]]
name = "SUPPORT_LOOKUP_IP_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "SUPPORT_LOOKUP_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 2, period = 60 }
