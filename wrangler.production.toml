# Production Cloudflare Worker config. Deployed
# by .github/workflows/cloudflare-production.yml on every push to main.
#
# `npm run build` (React Router with the Cloudflare Vite plugin, vite.config.ts)
# emits a workerd ESM module at dist/server/index.js with a standard
# `fetch(request, env, ctx)` export (server.ts) and the static assets in
# dist/client. This file points the Worker at that build output.
#
# wrangler.toml (no suffix) is the isolated preview config: no custom-domain
# routes, no rate limit bindings, staging catalog.
name = "opendrone-web"
main = "dist/server/index.js"
compatibility_date = "2025-04-01"

# The Worker serves opendrone.be and www.opendrone.be directly; the zone's
# nameservers point at Cloudflare.
# server.ts 301s www to the apex to match Shopify's current behaviour.
routes = [
  { pattern = "opendrone.be", custom_domain = true },
  { pattern = "www.opendrone.be", custom_domain = true },
]

[assets]
directory = "dist/client"

# Every five minutes, server.ts `scheduled` reconciles the preorder holds
# (always) and price steps (only while SHOPIFY_PRICE_TIER_WRITE_ENABLED is
# "1"), in case Shopify never delivered an orders/paid webhook, and runs the support ticket jobs
# (only once SUPPORT_DB and the Discord secrets exist).
[triggers]
crons = ["*/5 * * * *"]

# Public, non-secret defaults (see .env.example). SESSION_SECRET is a
# per-environment secret set with `wrangler secret put SESSION_SECRET` and is
# never written here.
[vars]
# Shop gates (README "Open or close the shop"). Closed: coming soon with the
# newsletter signup, cart and checkout writes refused. Open: "1" and "0".
# The Shopify domains and tokens, the per-SKU policy, the webhook secret and
# the price-step switch are Worker secrets.
SHOPIFY_CHECKOUT_WRITE_ENABLED = "1"
PUBLIC_COMING_SOON = "0"
# US consumer preorders (README "Open or close the shop"): "1" opens the US
# to campaign preorders once content/us-sales.json sets the US rate; changing
# it needs the founder's go.
PUBLIC_US_SALES = "1"
# Wholesale applications: company records only, pending staff review.
SHOPIFY_TRADE_WRITE_ENABLED = "1"
# Newsletter welcome sender (src app/lib/growth/welcome-email.ts). opendrone.be is a
# verified Resend domain; without this the welcome goes from sales@incutec.eu.
NEWSLETTER_FROM_EMAIL = "hello@opendrone.be"
# Support tickets (README "Support"). Shopify writes: the `support` tag and
# the `support.tickets` metafield on the matched customer. Reply emails are
# on by the founder's go of 2026-09-27.
SUPPORT_SHOPIFY_WRITE_ENABLED = "1"
SUPPORT_EMAIL_NOTIFY_ENABLED = "1"
# Customer mail (README "Mail"): Gmail poll that saves a ChatFPV reply as a
# Gmail draft for each customer mail; a person sends it. "0" off, "dry" reports
# counts only, "1" on. Needs the founder's go; the Gmail credentials are Worker secrets.
SUPPORT_MAIL_INTAKE_ENABLED = "0"
# ChatFPV (README "Support tickets"): AI ticket drafts in Discord, the
# /support Ask box and the product/preorder widget. "1" turns each on.
# CHATFPV_KEY is a Worker secret.
CHATFPV_URL = "https://chatfpv.com"
CHATFPV_DRAFTS_ENABLED = "1"
CHATFPV_ASK_ENABLED = "1"
CHATFPV_WIDGET_ENABLED = "1"
# ChatFPV handoff (#cfh tickets on product pages); anonymous, needs no accounts.
HANDOFF_ENABLED = "1"
# Shared accounts (README "Shared accounts"): sign-in, /oauth/* for
# chatfpv.com and the widget assertion.
# ACCOUNTS_TEST_IDP must never appear in this file (a unit test checks).
ACCOUNTS_ENABLED = "1"
CHATFPV_OAUTH_REDIRECTS = "https://chatfpv.com/auth/callback"
CHATFPV_POST_LOGOUT_REDIRECTS = "https://chatfpv.com/"
# Ops alerts (app/lib/ops-alerts.ts): a failed ChatFPV erase or a data request
# waiting on the founder posts to DISCORD_STAFF_METADATA_CHANNEL_ID once per
# UTC day. Production only: wrangler.toml never sets it.
OPS_ALERTS_ENABLED = "1"

# Support tickets: the ticket index and conversation copy. A new migration is
# applied with `npx wrangler d1 migrations apply SUPPORT_DB --remote
# --config wrangler.production.toml` before the deploy that needs it.
[[d1_databases]]
binding = "SUPPORT_DB"
database_name = "opendrone-support"
database_id = "0c84d763-1dd0-47f0-9950-53cce280296f"
migrations_dir = "migrations"

# ChatFPV Worker, called over a service binding: Cloudflare refuses a
# Worker's fetch to another workers.dev Worker on the same account.
[[services]]
binding = "CHATFPV"
service = "chatfpv"
