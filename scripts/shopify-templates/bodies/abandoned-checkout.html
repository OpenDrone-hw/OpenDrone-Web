<od-head kicker="Your cart">Your cart is waiting.</od-head>
<od-p>You left something in your cart. It is still here.</od-p>
{% for line in line_items %}
            <tr>
              <td class="od-px" style="padding: 0 32px 8px 32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top: 1px solid #1a241a;">
                  <tr>
                    <td valign="top" style="padding: 14px 0; font-family: Helvetica, Arial, sans-serif; font-size: 15px; color: #e5e5e5;">
                      {{ line.title }}
                      <span style="font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; color: #a0a0a0;"> &times; {{ line.quantity }}</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
{% endfor %}
<od-p small last>Preorder items are charged in full at checkout and carry their ship date on the product page.</od-p>
<od-button href="{{ url }}">Return to your cart &rarr;</od-button>
