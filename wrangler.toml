# Isolated Cloudflare preview. This Worker has no custom-domain routes and its
# commerce links point at staging with buying disabled.
name = "opendrone-web-preview"
main = "dist/server/index.js"
compatibility_date = "2025-04-01"

[assets]
directory = "dist/client"

[vars]
RUNTIME_PROFILE = "preview"
CATALOG_URL = "https://staging.incutec.eu/incutec/catalog.json"
PUBLIC_SHOP_URL = "https://staging.incutec.eu"
PUBLIC_COMING_SOON = "1"
