# Isolated Cloudflare preview Worker config. Deployed by
# .github/workflows/cloudflare-preview.yml on every push to
# feat/cloudflare-hosting. No custom-domain routes (a plain workers.dev URL
# only) and no rate limit bindings, so a preview deploy never touches
# production DNS or shares state with the production Worker. The Shopify
# catalog configuration is set as Worker secrets, like production.
#
# wrangler.production.toml is the real opendrone.be/www.opendrone.be Worker.
name = "opendrone-web-preview"
main = "dist/server/index.js"
compatibility_date = "2025-04-01"

[assets]
directory = "dist/client"

# Public, non-secret defaults (see .env.example). SESSION_SECRET is a
# per-environment secret set with `wrangler secret put SESSION_SECRET` and is
# never written here.
[vars]
SHOPIFY_CHECKOUT_WRITE_ENABLED = "0"
PUBLIC_COMING_SOON = "1"
