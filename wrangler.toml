# Isolated Cloudflare staging Worker config. Deployed by
# .github/workflows/cloudflare-preview.yml on every push to the `staging`
# branch and on a manual run.
# No custom-domain routes (a plain workers.dev URL only) and no rate limit
# bindings, so a staging deploy never touches production DNS or shares state
# with the production Worker. The Shopify catalog configuration is set as
# Worker secrets, like production.
#
# Staging runs the shop end to end: checkout is open and prices are shown,
# whatever production's state. It talks to the SAME Shopify store, so
# it stays behind HTTP basic auth (the STAGING_PASSWORD secret), and it
# never writes prices: SHOPIFY_PRICE_TIER_WRITE_ENABLED is absent here and
# only production steps a price. Pay with Shopify's test payment gateway;
# test orders are excluded from the campaign counts.
#
# wrangler.production.toml is the real opendrone.be/www.opendrone.be Worker.
name = "opendrone-web-preview"
main = "dist/server/index.js"
compatibility_date = "2025-04-01"

[assets]
directory = "dist/client"

# Public, non-secret defaults (see .env.example). SESSION_SECRET is a
# per-environment secret set with `wrangler secret put SESSION_SECRET` and is
# never written here.
[vars]
SHOPIFY_CHECKOUT_WRITE_ENABLED = "1"
PUBLIC_COMING_SOON = "0"
# US consumer preorders (README "Open or close the shop"): "1" opens the US
# to campaign preorders once content/us-sales.json sets the US rate; changing
# it needs the founder's go.
PUBLIC_US_SALES = "0"
# ChatFPV (README "Support tickets"): AI ticket drafts in Discord, the
# /support Ask box and the product/preorder widget. "1" turns each on.
# CHATFPV_KEY is a Worker secret.
CHATFPV_URL = "https://chatfpv.sales-ee0.workers.dev"
CHATFPV_DRAFTS_ENABLED = "1"
CHATFPV_ASK_ENABLED = "1"
CHATFPV_WIDGET_ENABLED = "1"
# Preview traffic is test traffic: every server call to ChatFPV carries
# X-ChatFPV-Synthetic: 1 so it never counts as customer usage. Production
# leaves it unset.
CHATFPV_SYNTHETIC = "1"
# ChatFPV handoff: a #cfh=<ticket> on a product page opens the widget on
# that conversation (app/lib/accounts/handoff.ts). Production keeps it off.
HANDOFF_ENABLED = "1"
# Shared accounts (README "Shared accounts"). Off on staging until the
# Shopify Customer Account client exists; E2E previews turn it on with
# `--var ACCOUNTS_ENABLED:1 --var ACCOUNTS_TEST_IDP:1`.
ACCOUNTS_ENABLED = "0"
CHATFPV_OAUTH_REDIRECTS = "https://chatfpv.sales-ee0.workers.dev/auth/callback"
CHATFPV_POST_LOGOUT_REDIRECTS = "https://chatfpv.sales-ee0.workers.dev/"
# Opt-in pilot map on /owners (README "Owners map"): Discord link, pins, /account card.
# "1" needs the founder's go; DISCORD_OAUTH_CLIENT_ID and _SECRET are Worker secrets.
PILOT_MAP_ENABLED = "0"

# Customer mail (README "Mail"): Gmail poll that saves a ChatFPV reply as a
# Gmail draft for each customer mail; a person sends it. "0" off, "dry" reports
# counts only, "1" on. Needs the founder's go; the Gmail credentials are Worker secrets.
SUPPORT_MAIL_INTAKE_ENABLED = "0"

# Support CRM (README "Support tickets"): the staff API under /api/staff/support
# for the internal app, and the community route to the public #help forum.
# "0" off; each needs the founder's go. SUPPORT_STAFF_API_TOKEN is a Worker
# secret. The community route also needs DISCORD_HELP_CHANNEL_ID and the
# wording marked TODO-LEGAL in app/lib/support/community.ts approved.
SUPPORT_CRM_API = "0"
SUPPORT_COMMUNITY_ROUTE = "0"

# Support tickets: the ticket index and conversation copy (README "Support").
# Apply new migrations with `npx wrangler d1 migrations apply SUPPORT_DB
# --remote --config wrangler.toml`. Local dev uses a local copy of
# this database under .wrangler/ (`npm run db:migrate:local`).
[[d1_databases]]
binding = "SUPPORT_DB"
database_name = "opendrone-support-preview"
database_id = "3ef6d8ce-e1f4-4d38-8306-c9afc0418b6d"
migrations_dir = "migrations"

# ChatFPV Worker, called over a service binding: Cloudflare refuses a
# Worker's fetch to another workers.dev Worker on the same account.
[[services]]
binding = "CHATFPV"
service = "chatfpv"

# Ticket attachments of the CRM (README "Support tickets"). Declare this binding
# only after the bucket exists, or the deploy fails:
#   npx wrangler r2 bucket create opendrone-support-files
# [[r2_buckets]]
# binding = "SUPPORT_FILES"
# bucket_name = "opendrone-support-files"
