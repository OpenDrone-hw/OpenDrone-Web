# Isolated Cloudflare staging Worker config. Deployed by
# .github/workflows/cloudflare-preview.yml on every push to the `staging`
# branch and on a manual run.
# No custom-domain routes (a plain workers.dev URL only) and no rate limit
# bindings, so a staging deploy never touches production DNS or shares state
# with the production Worker. The Shopify catalog configuration is set as
# Worker secrets, like production.
#
# Staging runs the shop end to end: checkout is open and prices are shown,
# whatever production's state. It talks to the SAME Shopify store, so
# it stays behind HTTP basic auth (the STAGING_PASSWORD secret), and it
# never writes prices: SHOPIFY_PRICE_TIER_WRITE_ENABLED is absent here and
# only production steps a price. Pay with Shopify's test payment gateway;
# test orders are excluded from the campaign counts.
#
# wrangler.production.toml is the real opendrone.be/www.opendrone.be Worker.
name = "opendrone-web-preview"
main = "dist/server/index.js"
compatibility_date = "2025-04-01"

[assets]
directory = "dist/client"

# Public, non-secret defaults (see .env.example). SESSION_SECRET is a
# per-environment secret set with `wrangler secret put SESSION_SECRET` and is
# never written here.
[vars]
SHOPIFY_CHECKOUT_WRITE_ENABLED = "1"
PUBLIC_COMING_SOON = "0"

# Support tickets: the ticket index and conversation copy (README "Support").
# Create once with `npx wrangler d1 create opendrone-support-preview`, paste
# the id here, then apply migrations/ with `npx wrangler d1 migrations apply
# SUPPORT_DB --remote --config wrangler.toml`. Local dev uses a local copy of
# this database under .wrangler/ (`npm run db:migrate:local`).
[[d1_databases]]
binding = "SUPPORT_DB"
database_name = "opendrone-support-preview"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
