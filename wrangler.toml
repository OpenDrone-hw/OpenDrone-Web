# Cloudflare Workers config for the D15 hosting preview (erp/PLAN.md).
#
# The build is unchanged: `npm run build` (Hydrogen's Vite/Oxygen toolchain,
# decision D3) already emits a plain workerd ESM module at dist/server/index.js
# with a standard `fetch(request, env, ctx)` export, because Oxygen is itself
# Shopify's Cloudflare Workers host. This file only points real Cloudflare
# Workers at that same build output; no server code changed.
name = "opendrone-web"
main = "dist/server/index.js"
compatibility_date = "2025-04-01"

[assets]
directory = "dist/client"

# Public, non-secret defaults (see .env.example). SESSION_SECRET is a
# per-environment secret set with `wrangler secret put SESSION_SECRET` and is
# never written here.
[vars]
CATALOG_URL = "https://erp.incutec.eu/incutec/catalog.json"
PUBLIC_SHOP_URL = "https://shop.incutec.com"
