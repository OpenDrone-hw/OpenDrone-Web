# Reply-notification sweep. Hits /api/support/notify with the bearer
# token; the route emails customers one batched notification per ticket
# for staff replies they haven't seen in the widget, then posts a bot
# confirmation into the Discord thread.
#
# Required repo secret: SUPPORT_CLEANUP_SECRET (same secret as the
# cleanup sweep; must match the Worker secret of the same name, set
# with `wrangler secret put`).

name: Support notify

on:
  schedule:
    # Every 15 minutes. Combined with the route's 10-minute quiet
    # period, a staff reply reaches the customer's inbox within
    # roughly 10-25 minutes unless they saw it live in the widget.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit notify endpoint
        env:
          SUPPORT_CLEANUP_SECRET: ${{ secrets.SUPPORT_CLEANUP_SECRET }}
        run: |
          if [ -z "$SUPPORT_CLEANUP_SECRET" ]; then
            echo "SUPPORT_CLEANUP_SECRET is not set in repo secrets" >&2
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST https://opendrone.store/api/support/notify \
            -H "Authorization: Bearer $SUPPORT_CLEANUP_SECRET" \
            -H "Content-Type: application/json")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
