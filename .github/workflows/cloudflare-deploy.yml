name: Deploy to Cloudflare

# D15/D16 (erp/PLAN.md): opendrone.be is cut over to the Cloudflare Worker
# "opendrone-web" with custom domains opendrone.be / www.opendrone.be. Every
# push to main redeploys production; feat/cloudflare-hosting stays wired too
# so that branch keeps deploying to the same Worker while a PR against it is
# open (the state before cutover, kept for the next such change).
on:
  push:
    branches: [main, feat/cloudflare-hosting]

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # SESSION_SECRET only needs to be well-formed for the build step (it is
      # not baked into the bundle); the real value is the Worker's
      # SESSION_SECRET secret, set separately with `wrangler secret put`.
      - name: Build
        env:
          SESSION_SECRET: "ci-build-only-not-the-runtime-secret"
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # wrangler-action@v3 defaults to wrangler 3.90, which doesn't
          # understand `custom_domain = true` in wrangler.toml's `routes`
          # and falls back to the deprecated zone-level Workers Routes
          # API (`/zones/.../workers/routes`) instead of the account-level
          # Custom Domains API this token is scoped for. Pin wrangler 4 so
          # `deploy` provisions opendrone.be / www.opendrone.be as custom
          # domains the same way the verified local deploy did.
          wranglerVersion: "4"
